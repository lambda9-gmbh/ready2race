    ChainProgressionMode:
      type: string
      description: >-
        Three modes for the finish/activate chain: SCHIEDSRICHTER keeps finish+chain on the referee
        dashboard (as before); REGATTABUERO moves both exclusively to the schedule tab (the finish
        button disappears from the referee dashboard); DEAKTIVIERT lets finish affect only the
        match itself, without activating the next start time's matches.
      enum:
        - 'SCHIEDSRICHTER'
        - 'REGATTABUERO'
        - 'DEAKTIVIERT'

    PublicResultsVisibility:
      type: string
      description: >-
        From which state on a match shows up as a result on the public views (athlete board, kiosk,
        public results page): FINISHED_ONLY only for finished matches (finished_at set),
        RESULTS_COMPLETE additionally for matches whose boats are all scored (AWAITING_FINISH).
        Defaults to FINISHED_ONLY, because until a match is finished a time penalty can still
        arrive and a published result that changes afterwards cannot be taken back.
      enum:
        - 'FINISHED_ONLY'
        - 'RESULTS_COMPLETE'

