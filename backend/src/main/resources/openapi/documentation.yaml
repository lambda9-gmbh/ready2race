            update can be applied as a diff instead of recreating everything.
        name:
          type: string
        required:
          type: boolean
        updatable:
          type: boolean
          description: >-
            Read-only. False when the round has already been created during execution and therefore must not be
            changed. Ignored on incoming update requests.
        matches:
          type: array
          items:
            $ref: '#/components/schemas/CompetitionSetupMatchDto'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/CompetitionSetupGroupDto'
