    MatchStatusDto:
      type: object
      description: >-
        The derived state of a match, read by every surface - one derivation, three callers
        (execution page, schedule, referee dashboard).


        "Overdue" and "partially scored" are deliberately NOT states of their own but readings of
        these fields: partially scored is state != RUNNING && 0 < teamsScored < teamsTotal, overdue
        is state == UPCOMING && startTime + 5 min < now. Elapsed minutes and overdueness are
        computed in the frontend against the browser clock so the chip keeps counting between two
        polls.
      required:
        - state
        - teamsTotal
        - teamsScored
      properties:
        state:
          $ref: '#/components/schemas/LiveDashboardMatchState'
        startedAt:
          type: string
          format: date-time
          description: Actual start - null while nobody started the match.
        teamsTotal:
          type: integer
        teamsScored:
          type: integer
          description: >-
            Scored means: deregistered OR place set OR failed - the same rule the referee dashboard
            uses.
        teamsInArena:
          type: integer
          description: null = not collected in this view (schedule, public boards).

    CompetitionMatchDto:
      type: object
      required:
        - id
        - teams
        - weighting
        - executionOrder
        - skipped
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        teams:
          type: array
          items:
            $ref: '#/components/schemas/CompetitionMatchTeamDto'
        weighting:
          type: integer
        executionOrder:
          type: integer
        startTime:
          type: string
          format: date-time
          description: Planned start from the schedule.
        startTimeOffset:
          type: integer
          description: Offset between the starts of consecutive teams, in seconds
        activatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the match was called to the start - null while nobody activated it.
        startedAt:
          type: string
          format: date-time
          description: Actual start - null while nobody started the match.
        finishedAt:
          type: string
          format: date-time
          description: >-
            Persisted end. Set means exclusively that somebody finished the match.
