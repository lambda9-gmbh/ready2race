    parameters:
      - $ref: '#/components/parameters/eventId'
    post:
      operationId: importEventSchedule
      description: >-
        Imports a flat xlsx schedule export, matching rows to setup rounds by name. dryRun=true
        (the default if the field is missing or unparsable) only returns the match preview per row;
        dryRun=false replaces the event's whole timeline with the import on success.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: "Flat xlsx schedule export"
                dryRun:
                  type: boolean
                  description: "Defaults to true (preview only) if missing or unparsable"
      responses:
        200:
          description: Import preview or result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleImportResultDto'
