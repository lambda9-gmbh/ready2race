          type: string
          format: uuid
          nullable: true
          description: Event-wide default race results import; inherited while the competition's own field is null.

    EventTimingConfigDto:
      type: object
      description: >
        Event-wide timing defaults. RaceClocker races are created per event, so the timing system and
        the two results URLs live here once and every competition without its own values inherits
        them. Column presets stay per competition - they depend on the concrete start list.
      properties:
        timingSystem:
          $ref: '#/components/schemas/TimingSystem'
          nullable: true
        timeTrialResultsUrl:
          type: string
          nullable: true
        heatsResultsUrl:
          type: string
          nullable: true
        startlistConfigQualification:
          type: string
          format: uuid
          nullable: true
        startlistConfigRounds:
          type: string
          format: uuid
          nullable: true
        resultImportConfig:
          type: string
          format: uuid
          nullable: true
        autoPull:
          type: boolean
          description: Whether the background job pulls results for this event on its own.
        intervalActiveSeconds:
          type: integer
          description: Poll interval while at least one match of this event is running. Never goes below 2 seconds.
        intervalUpcomingSeconds:
          type: integer
          description: Poll interval while only upcoming matches are watched. Never goes below 2 seconds.
        watchBeforeMinutes:
          type: integer
          description: How long before its planned start an upcoming match is watched.
        watchAfterMinutes:
          type: integer
          description: How long after its planned start a match that is not active yet is still watched.
        deviatingCompetitions:
          type: array
          description: The competitions that do not follow these defaults but set at least one of the three fields themselves.
          items:
            $ref: '#/components/schemas/CompetitionTimingDeviationDto'
      required:
        - autoPull
        - intervalActiveSeconds
        - intervalUpcomingSeconds
        - watchBeforeMinutes
        - watchAfterMinutes

    CompetitionTimingDeviationDto:
      type: object
      description: >
        A competition that overrides the event-wide timing defaults. Only the inheritable fields are
        listed; the column presets are per competition anyway and therefore no deviation. A null
        timingSystem with a URL set is a partial override - the competition inherits the system and
        has a race of its own.
      properties:
        competitionId:
          type: string
          format: uuid
        identifier:
          type: string
        name:
          type: string
        timingSystem:
          $ref: '#/components/schemas/TimingSystem'
          nullable: true
        timeTrialResultsUrl:
          type: string
          nullable: true
        heatsResultsUrl:
          type: string
          nullable: true
        startlistConfigQualification:
          type: string
          format: uuid
          nullable: true
        startlistConfigRounds:
          type: string
          format: uuid
          nullable: true
        resultImportConfig:
          type: string
          format: uuid
          nullable: true
      required:
        - competitionId
        - identifier
        - name

    EventTimingConfigRequest:
      type: object
      description: >
        The RaceClocker fields are optional, like the per-competition config. The URLs must be https
        URLs on raceclocker.com. The five auto-pull fields are not optional - the database always has
        a value for them, and null here would ambiguously mean "leave unchanged".
      properties:
        timingSystem:
