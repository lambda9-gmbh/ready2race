      description: "What can be configured per competition for a failed check"
      enum:
        - OK
        - WARNING
        - CRITICAL

    EffectiveSeverity:
      type: string
      description: "What is delivered for display; NEUTRAL means there is nothing to say about this check - either it does not apply, or it failed but is explicitly configured as CheckSeverity.OK"
      enum:
        - NEUTRAL
        - OK
        - WARNING
        - CRITICAL

