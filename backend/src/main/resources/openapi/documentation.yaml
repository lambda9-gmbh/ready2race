    AwardCeremonyChoiceDto:
      description: Eine Ehrung zur Auswahl - die Einheit ist (Wettkampf, Wertung).
      type: object
      required:
        - competitionId
        - competitionIdentifier
        - competitionName
        - awardedTeams
      properties:
        competitionId:
          type: string
          format: uuid
        competitionIdentifier:
          description: Die Rennnummer des Wettkampfs, z. B. "17-NC".
          type: string
        competitionShortName:
          description: Der Kurzname des Wettkampfs, z. B. "CM 4x+".
          type: string
          nullable: true
        competitionName:
          type: string
        ratingCategoryName:
          description: >-
            Die Wertung, in der geehrt wird. `null` ist ein gültiger Wert und heißt "der Wettkampf
            wird als Ganzes geehrt", nicht "unbekannt".
          type: string
          nullable: true
        awardedTeams:
          description: >-
            Die Zahl der Boote, die auf dem Blatt landen: Ränge bis drei, Gleichstände
            eingeschlossen. Bewusst nicht die Zahl aller platzierten Boote der Wertung.
          type: integer

    AwardCeremonyKeyRequest:
      description: Verweist auf genau eine Ehrung aus der Liste.
      type: object
      required:
        - competitionId
      properties:
        competitionId:
          type: string
          format: uuid
        ratingCategoryName:
          description: >-
            Muss dem Wert der gewünschten Ehrung entsprechen - `null` trifft die Ehrung ohne
            Wertung und ist kein Platzhalter für "alle".
          type: string
          nullable: true

    AwardCeremonySelectionRequest:
      type: object
      properties:
        selection:
          description: >-
            Leere oder fehlende Auswahl heißt "alle Ehrungen drucken". Ein Schlüssel, zu dem es
            keine Ehrung gibt, führt zu 400 statt zu einem still fehlenden Blatt.
          type: array
          items:
            $ref: '#/components/schemas/AwardCeremonyKeyRequest'
