    LiveDashboardMatchState:
      type: string
      description: >-
        SKIPPED: the schedule slot of this match was cancelled. Unlike the public boards the referee
        dashboard marks such a match instead of hiding it - the referee has to see the cancellation
        to be able to undo it in the schedule.


        AWAITING_FINISH: every boat is scored but nobody finished the match yet. FINISHED means
        exclusively that competition_match.finished_at is set - a match only ends by an explicit
        action, because until then a time penalty can still arrive.


        PREPARING: the match has been called to the start (activated_at is set) but has no real
        start yet - the boats are still at the pontoon. RUNNING means activated AND started.
      enum:
        - PREPARING
        - RUNNING
        - FINISHED
        - SKIPPED
        - AWAITING_FINISH
        - UPCOMING
        - UNSCHEDULED

    LiveDashboardInvoiceState:
      type: string
      enum:
        - PAID
        - OPEN
