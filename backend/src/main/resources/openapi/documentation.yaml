  /event/{eventId}/schedule/round/{setupRoundId}/skip:
    parameters:
      - $ref: '#/components/parameters/eventId'
      - name: setupRoundId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: skipScheduleRound
      description: "Skips every schedule slot of this setup round belonging to the event - same rules as skipping a single slot (already skipped slots are left as they are, a started match blocks the whole action). Only allowed when the round has nothing left to race: 409 if the round has no materialized matches yet (cancel its slots individually instead), and 409 if any match of the round still has 2 or more racing (non-deregistered, non-out) teams - those must be executed so the next round can be seeded."
      responses:
        204:
          $ref: '#/components/responses/204'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'

  /event/{eventId}/schedule/shift:
    parameters:
      - $ref: '#/components/parameters/eventId'
    post:
      operationId: shiftEventSchedule
      description: "Shifts the timeline of the same race day, starting at fromSlotId. dryRun=true only computes the preview."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftScheduleRequest'
      responses:
        200:
          description: Shift computed (and applied unless dryRun)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftPreviewDto'
