components:

  parameters:

    # query

    limit:
      name: limit
      in: query
      description: Page size for pagination
      required: false
      schema:
        type: integer

    offset:
      name: offset
      in: query
      description: Result offset for pagination
      required: false
      schema:
        type: integer

    sort:
      name: sort
      in: query
      description: "Fields with direction (as JSON [{field: <field>, direction: ASC | DESC}, ...]) sorting result for pagination"
      required: false
      schema:
        type: string

    search:
      name: search
      in: query
      description: Filter result with space-separated search terms for pagination
      required: false
      schema:
        type: string


    challenge:
      name: challenge
      in: query
      description: Captcha challenge id
      required: true
      schema:
        type: string
        format: uuid

    input:
      name: input
      in: query
      description: Captcha solution
      required: true
      schema:
        type: integer


    # path params

    eventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    eventDayId:
      name: eventDayId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    competitionId:
      name: competitionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    competitionRegistrationId:
      name: competitionRegistrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid



  responses:

    file:
      description: File retrieved
      headers:
        Content-Disposition:
          schema:
            type: string
      content:
        '*/*':
          schema:
            type: string
            format: binary

    201:
      description: Entity successfully created, returns the id
      content:
        application/json:
          schema:
            type: string
            format: uuid

    204:
      description: No Content

    400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestError'

    401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    404:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    422:
      description: Unprocessable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnprocessableEntityError'

    429:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsError'

    500:
      description: Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    502:
      description: Bad Gateway
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'


    409EmailInUse:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnprocessableEntityError'

  schemas:

    # enums

    Action:
      type: string
      enum:
        - CREATE
        - READ
        - UPDATE
        - DELETE

    Resource:
      type: string
      enum:
        - USER
        - EVENT
        - CLUB
        - REGISTRATION
        - INVOICE
        - SUBSTITUTION
        - APP_EVENT_REQUIREMENT
        - APP_QR_MANAGEMENT
        - APP_COMPETITION_CHECK
        - APP_CATERER
        - ADMINISTRATION
        - WEB_DAV
        - RESULT
        - LIVE_DASHBOARD

    Scope:
      type: string
      enum:
        - OWN
        - GLOBAL

    EmailLanguage:
      type: string
      enum:
        - DE
        - EN
        - DA

    ErrorCode:
      type: string
      enum:
        - INTERNAL_ERROR
        - CAPTCHA_WRONG
        - EMAIL_IN_USE
