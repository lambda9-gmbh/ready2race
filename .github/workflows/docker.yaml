name: Docker

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      build-db:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: ready2race-build
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: build-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U developer -d ready2race-build"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BUILD_DATABASE_URL: jdbc:postgresql://localhost:5432/ready2race-build
      BUILD_DATABASE_USER: developer
      BUILD_DATABASE_PASSWORD: build-only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test
      - name: Backend tests
        run: ./gradlew :backend:test --no-daemon
      - name: Build local images
        run: |
          docker build -f backend/Dockerfile -t ready2race-backend:local .
          docker build -f frontend/Dockerfile -t ready2race-frontend:local .
      - name: Test deployment and instance isolation
        run: sh scripts/docker-smoke-test.sh

  publish:
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        env:
          COMPONENT: ${{ matrix.component }}
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
